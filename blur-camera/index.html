<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ぼかしカメラ</title>
  <style>
    :root {
      --bg: #000000;
      --bar: #111418;
      --text: #e6edf3;
      --muted: #8d96a0;
      --border: #30363d;
      --accent: #4493f8;
      --danger: #f85149;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    header, footer {
      background: var(--bar);
      flex: none;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
    }
    header a { color: var(--accent); text-decoration: none; white-space: nowrap; }
    header h1 { margin: 0; font-size: 1rem; white-space: nowrap; }
    header label {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 0;
    }
    header input[type="range"] { width: 100px; min-width: 60px; }
    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #view { touch-action: none; display: block; }
    #msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      pointer-events: none;
    }
    #msg:empty { display: none; }
    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }
    #flash.on { animation: flash 0.25s ease-out; }
    @keyframes flash { from { opacity: 0.8; } to { opacity: 0; } }
    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }
    .group { display: flex; gap: 8px; }
    .group.right { justify-content: flex-end; }
    button {
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.35; }
    button.danger { color: var(--danger); }
    #shutter {
      width: 68px;
      height: 68px;
      padding: 0;
      border: 4px solid var(--text);
      background: transparent;
      position: relative;
    }
    #shutter::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: var(--text);
    }
    #shutter:active::after { transform: scale(0.9); }
    #video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    #result {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    #result[hidden] { display: none; }
    #result .img-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
    }
    #photo {
      max-width: 100%;
      max-height: 100%;
    }
    #result .note {
      margin: 0;
      padding: 0 16px 8px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    #result .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--bar);
    }
  </style>
</head>
<body>
  <header>
    <a href="../">← 一覧</a>
    <h1>ぼかしカメラ</h1>
    <label>強さ <input id="strength" type="range" min="2" max="12" step="1" value="5"></label>
  </header>

  <div id="stage">
    <canvas id="view"></canvas>
    <div id="msg">カメラを起動中…</div>
    <div id="flash"></div>
  </div>

  <footer>
    <div class="group">
      <button id="add">＋ぼかし</button>
      <button id="remove" class="danger" disabled>削除</button>
    </div>
    <button id="shutter" aria-label="撮影" disabled></button>
    <div class="group right">
      <button id="switch" hidden>切替</button>
    </div>
  </footer>

  <video id="video" playsinline muted autoplay></video>

  <div id="result" hidden>
    <div class="img-wrap"><canvas id="photo" aria-label="撮影した写真 (ぼかし表示)"></canvas></div>
    <p class="note">保存・共有される画像にはぼかしは入りません</p>
    <div class="actions">
      <button id="retake">撮り直す</button>
      <button id="save">保存</button>
      <button id="share" hidden>共有</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "blur-camera:v1";
    const HANDLE_PX = 22;   // 角ハンドルのタップ判定半径 (CSS px)
    const MIN_SIZE_PX = 32; // ぼかし領域の最小サイズ (CSS px)

    const video = document.getElementById("video");
    const view = document.getElementById("view");
    const ctx = view.getContext("2d");
    const stage = document.getElementById("stage");
    const msg = document.getElementById("msg");
    const flash = document.getElementById("flash");
    const strengthInput = document.getElementById("strength");
    const addBtn = document.getElementById("add");
    const removeBtn = document.getElementById("remove");
    const shutterBtn = document.getElementById("shutter");
    const switchBtn = document.getElementById("switch");
    const result = document.getElementById("result");
    const photo = document.getElementById("photo");
    const saveBtn = document.getElementById("save");
    const shareBtn = document.getElementById("share");
    const retakeBtn = document.getElementById("retake");

    // ぼかし領域は映像フレームに対する正規化座標 (0〜1) で持つ。
    // プレビューと撮影で解像度が違っても同じ位置に掛かる。
    let regions = [];
    let selected = -1;
    let drag = null;
    let facingMode = "environment";
    let stream = null;
    let frameW = 0, frameH = 0;
    let photoBlob = null, photoUrl = null;

    // ---- 設定の保存 (失敗しても動作に影響しない) ----
    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (s && Array.isArray(s.regions)) regions = s.regions;
        if (s && s.strength) strengthInput.value = s.strength;
      } catch {}
    }
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ regions, strength: strengthInput.value }));
      } catch {}
    }

    // ---- ぼかし処理 ----
    // 領域を縮小してから拡大し直すことでぼかす。半分ずつ縮小して画素を平均化し、
    // 最終サイズの小さなキャンバスをバイリニア補間で引き伸ばす。
    // ctx.filter に頼らないので iOS Safari でも同じ結果になる。
    const scratch = [document.createElement("canvas"), document.createElement("canvas")];
    const scratchCtx = scratch.map((c) => c.getContext("2d"));

    function blurRect(dst, src, sx, sy, sw, sh, dx, dy, dw, dh, blockPx) {
      const tw = Math.max(1, Math.round(sw / blockPx));
      const th = Math.max(1, Math.round(sh / blockPx));
      let cur = src, cx = sx, cy = sy, cw = sw, ch = sh, i = 0;
      do {
        const nw = Math.max(tw, Math.ceil(cw / 2));
        const nh = Math.max(th, Math.ceil(ch / 2));
        const c = scratch[i], cc = scratchCtx[i];
        if (c.width !== nw || c.height !== nh) { c.width = nw; c.height = nh; }
        cc.imageSmoothingEnabled = true;
        cc.imageSmoothingQuality = "high";
        cc.drawImage(cur, cx, cy, cw, ch, 0, 0, nw, nh);
        cur = c; cx = 0; cy = 0; cw = nw; ch = nh;
        i = 1 - i;
      } while (cw !== tw || ch !== th);
      dst.imageSmoothingEnabled = true;
      dst.imageSmoothingQuality = "high";
      dst.drawImage(cur, 0, 0, tw, th, dx, dy, dw, dh);
    }

    // source (映像または撮影済みフレーム) を描き、全ぼかし領域を適用する。outW/outH は出力キャンバスの画素数。
    function renderFrame(target, outW, outH, source = video) {
      target.drawImage(source, 0, 0, frameW, frameH, 0, 0, outW, outH);
      const blockPx = Math.min(frameW, frameH) * (Number(strengthInput.value) / 100);
      for (const r of regions) {
        const sx = Math.max(0, Math.floor(r.x * frameW));
        const sy = Math.max(0, Math.floor(r.y * frameH));
        const sw = Math.min(frameW, Math.ceil((r.x + r.w) * frameW)) - sx;
        const sh = Math.min(frameH, Math.ceil((r.y + r.h) * frameH)) - sy;
        if (sw <= 0 || sh <= 0) continue;
        // 出力側は外側に丸めて、ぼかしの縁から元映像が覗かないようにする
        const dx = Math.floor(sx / frameW * outW);
        const dy = Math.floor(sy / frameH * outH);
        const dw = Math.ceil((sx + sw) / frameW * outW) - dx;
        const dh = Math.ceil((sy + sh) / frameH * outH) - dy;
        blurRect(target, source, sx, sy, sw, sh, dx, dy, dw, dh, blockPx);
      }
    }

    // ---- プレビュー ----
    function cssSize() {
      return { w: view.clientWidth, h: view.clientHeight };
    }

    function fitCanvas() {
      if (!frameW) return;
      const rect = stage.getBoundingClientRect();
      const scale = Math.min(rect.width / frameW, rect.height / frameH);
      const w = Math.floor(frameW * scale), h = Math.floor(frameH * scale);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      view.style.width = w + "px";
      view.style.height = h + "px";
      view.width = Math.round(w * dpr);
      view.height = Math.round(h * dpr);
    }

    function drawOverlay() {
      const dpr = view.width / view.clientWidth;
      regions.forEach((r, i) => {
        const x = r.x * view.width, y = r.y * view.height;
        const w = r.w * view.width, h = r.h * view.height;
        const isSel = i === selected;
        ctx.save();
        ctx.lineWidth = (isSel ? 2 : 1) * dpr;
        ctx.setLineDash(isSel ? [6 * dpr, 4 * dpr] : []);
        ctx.strokeStyle = "rgba(0,0,0,0.6)";
        ctx.strokeRect(x + dpr, y + dpr, w, h);
        ctx.strokeStyle = isSel ? "#ffffff" : "rgba(255,255,255,0.5)";
        ctx.strokeRect(x, y, w, h);
        if (isSel) {
          ctx.setLineDash([]);
          for (const [cx, cy] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) {
            ctx.beginPath();
            ctx.arc(cx, cy, 9 * dpr, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.lineWidth = 2 * dpr;
            ctx.strokeStyle = "#4493f8";
            ctx.stroke();
          }
        }
        ctx.restore();
      });
    }

    function loop() {
      if (video.readyState >= 2 && video.videoWidth) {
        if (video.videoWidth !== frameW || video.videoHeight !== frameH) {
          frameW = video.videoWidth;
          frameH = video.videoHeight;
          fitCanvas();
          msg.textContent = "";
          shutterBtn.disabled = false;
        }
        renderFrame(ctx, view.width, view.height);
        drawOverlay();
      }
      requestAnimationFrame(loop);
    }

    // ---- カメラ ----
    async function startCamera() {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = null;
      frameW = frameH = 0;
      shutterBtn.disabled = true;
      msg.textContent = "カメラを起動中…";
      ctx.clearRect(0, 0, view.width, view.height);
      if (!navigator.mediaDevices?.getUserMedia) {
        msg.textContent = "このブラウザはカメラに対応していません。";
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: facingMode }, width: { ideal: 3840 }, height: { ideal: 2160 } },
        });
        video.srcObject = stream;
        await video.play();
        const devices = await navigator.mediaDevices.enumerateDevices();
        switchBtn.hidden = devices.filter((d) => d.kind === "videoinput").length < 2;
      } catch (e) {
        msg.textContent = e.name === "NotAllowedError"
          ? "カメラの使用が許可されていません。ブラウザの設定から許可してください。"
          : "カメラを起動できませんでした (" + e.name + ")";
      }
    }

    // ---- 操作 ----
    function pointerPos(e) {
      const rect = view.getBoundingClientRect();
      return { x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height };
    }

    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    function hitTest(p) {
      const { w: cw, h: ch } = cssSize();
      if (selected >= 0) {
        const r = regions[selected];
        const corners = { tl: [r.x, r.y], tr: [r.x + r.w, r.y], bl: [r.x, r.y + r.h], br: [r.x + r.w, r.y + r.h] };
        for (const [name, [x, y]] of Object.entries(corners)) {
          if (Math.hypot((p.x - x) * cw, (p.y - y) * ch) <= HANDLE_PX) {
            return { index: selected, mode: "resize", corner: name };
          }
        }
      }
      for (let i = regions.length - 1; i >= 0; i--) {
        const r = regions[i];
        if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
          return { index: i, mode: "move" };
        }
      }
      return null;
    }

    function setSelected(i) {
      selected = i;
      removeBtn.disabled = i < 0;
    }

    view.addEventListener("pointerdown", (e) => {
      if (!frameW) return;
      const p = pointerPos(e);
      const hit = hitTest(p);
      if (!hit) { setSelected(-1); return; }
      setSelected(hit.index);
      view.setPointerCapture(e.pointerId);
      drag = { ...hit, pointerId: e.pointerId, start: p, rect: { ...regions[hit.index] } };
    });

    view.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.pointerId) return;
      const p = pointerPos(e);
      const r = regions[drag.index];
      const s = drag.rect;
      if (drag.mode === "move") {
        r.x = clamp(s.x + p.x - drag.start.x, 0, 1 - s.w);
        r.y = clamp(s.y + p.y - drag.start.y, 0, 1 - s.h);
      } else {
        const { w: cw, h: ch } = cssSize();
        const minW = MIN_SIZE_PX / cw, minH = MIN_SIZE_PX / ch;
        const px = clamp(p.x, 0, 1), py = clamp(p.y, 0, 1);
        let x1 = s.x, y1 = s.y, x2 = s.x + s.w, y2 = s.y + s.h;
        if (drag.corner[1] === "l") x1 = Math.min(px, x2 - minW); else x2 = Math.max(px, x1 + minW);
        if (drag.corner[0] === "t") y1 = Math.min(py, y2 - minH); else y2 = Math.max(py, y1 + minH);
        r.x = x1; r.y = y1; r.w = x2 - x1; r.h = y2 - y1;
      }
    });

    function endDrag(e) {
      if (!drag || e.pointerId !== drag.pointerId) return;
      drag = null;
      saveState();
    }
    view.addEventListener("pointerup", endDrag);
    view.addEventListener("pointercancel", endDrag);

    addBtn.addEventListener("click", () => {
      const offset = (regions.length % 5) * 0.04;
      regions.push({ x: 0.3 + offset, y: 0.35 + offset, w: 0.4, h: 0.2 });
      setSelected(regions.length - 1);
      saveState();
    });

    removeBtn.addEventListener("click", () => {
      if (selected < 0) return;
      regions.splice(selected, 1);
      setSelected(-1);
      saveState();
    });

    strengthInput.addEventListener("change", saveState);

    switchBtn.addEventListener("click", () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
    });

    // ---- 撮影 ----
    // 保存する画像はぼかしなしの元フレーム。撮影結果の確認画面では、
    // 同じフレームにぼかしを掛けたものを表示して、隠した範囲が見えないようにする。
    shutterBtn.addEventListener("click", () => {
      if (!frameW) return;
      const raw = document.createElement("canvas");
      raw.width = frameW;
      raw.height = frameH;
      raw.getContext("2d").drawImage(video, 0, 0, frameW, frameH);
      photo.width = frameW;
      photo.height = frameH;
      renderFrame(photo.getContext("2d"), frameW, frameH, raw);
      flash.classList.remove("on");
      void flash.offsetWidth;
      flash.classList.add("on");
      raw.toBlob((blob) => {
        if (!blob) return;
        photoBlob = blob;
        photoUrl = URL.createObjectURL(blob);
        shareBtn.hidden = !canShareFile();
        result.hidden = false;
      }, "image/jpeg", 0.92);
    });

    function fileName() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `blur-camera-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
    }

    function photoFile() {
      return new File([photoBlob], fileName(), { type: "image/jpeg" });
    }

    function canShareFile() {
      try {
        return !!navigator.canShare && navigator.canShare({ files: [photoFile()] });
      } catch {
        return false;
      }
    }

    saveBtn.addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = photoUrl;
      a.download = fileName();
      document.body.append(a);
      a.click();
      a.remove();
    });

    shareBtn.addEventListener("click", async () => {
      try {
        await navigator.share({ files: [photoFile()] });
      } catch {}
    });

    retakeBtn.addEventListener("click", () => {
      result.hidden = true;
      photo.width = photo.height = 0;
      if (photoUrl) URL.revokeObjectURL(photoUrl);
      photoUrl = null;
      photoBlob = null;
    });

    window.addEventListener("resize", fitCanvas);

    loadState();
    startCamera();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
