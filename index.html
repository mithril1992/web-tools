<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>web-tools</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d8dee4;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --text: #e6edf3;
        --muted: #8d96a0;
        --border: #30363d;
        --accent: #4493f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .lead { margin: 0 0 24px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.tool {
      display: block;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
    }
    a.tool:hover, a.tool:focus-visible { border-color: var(--accent); }
    .tool-name { font-weight: 600; color: var(--accent); }
    .tool-desc { margin-top: 2px; font-size: 0.9rem; color: var(--muted); }
    .empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
    footer { margin-top: 32px; font-size: 0.85rem; color: var(--muted); }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>web-tools</h1>
    <p class="lead">主にスマホのWebブラウザから使える、特定用途のツール群です。</p>

    <ul id="tools"></ul>

    <footer>
      <a href="https://github.com/mithril1992/web-tools">GitHub</a>
    </footer>
  </main>

  <script>
    // ツールを追加したら、ここに { name, path, description } を追記する
    const tools = [
      { name: "ぼかしカメラ", path: "blur-camera/", description: "指定した範囲を見ないようにしながら写真を撮影する" },
    ];

    const list = document.getElementById("tools");
    if (tools.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "ツールはまだありません。";
      list.append(li);
    }
    for (const tool of tools) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "tool";
      a.href = tool.path;
      const name = document.createElement("div");
      name.className = "tool-name";
      name.textContent = tool.name;
      const desc = document.createElement("div");
      desc.className = "tool-desc";
      desc.textContent = tool.description;
      a.append(name, desc);
      li.append(a);
      list.append(li);
    }
  </script>
</body>
</html>
